name: S4 Backend Release Gate

on:
  push:
    branches:
      - s4-release-stabilization
  pull_request:
    paths:
      - 'security-backend-nest/**'
      - '.github/workflows/s4-backend-release-gate.yml'

jobs:
  backend-release-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: s4
          POSTGRES_PASSWORD: s4_test_password
          POSTGRES_DB: s4_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s4 -d s4_release_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: security-backend-nest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://s4:s4_test_password@localhost:5432/s4_release_gate
      DATABASE_SSL: 'false'
      DATABASE_SYNCHRONIZE: 'false'
      JWT_SECRET: s4-release-gate-only-secret-not-for-production
      CORS_ORIGIN: http://localhost:3001
      ENABLE_SWAGGER: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: security-backend-nest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Run migrations on clean database
        run: npm run migration:run

      - name: Prove migrations are idempotent
        run: npm run migration:run

      - name: Show migration state
        run: npm run migration:show

      - name: Detect entity-to-migration schema drift
        shell: bash
        run: |
          set -o pipefail
          npm run typeorm -- schema:log -d src/database/data-source.ts 2>&1 | tee /tmp/s4-schema.log
          if grep -Eiq '(CREATE|ALTER|DROP)[[:space:]]+(TABLE|TYPE|INDEX)|ADD[[:space:]]+CONSTRAINT|DROP[[:space:]]+CONSTRAINT' /tmp/s4-schema.log; then
            echo 'Schema drift detected: entities and migrations do not produce the same schema.'
            exit 1
          fi
          echo 'No schema drift detected.'
