name: S4 Mobile Release Gate

on:
  push:
    branches:
      - s4-release-stabilization
      - release/v1.0.0-rc1
      - release/s4-pilot-rc1
      - main
    paths:
      - 'security-mobile-app/**'
      - '.github/workflows/s4-mobile-release-gate.yml'
  pull_request:
    branches:
      - main
      - release/v1.0.0-rc1
      - release/s4-pilot-rc1
    paths:
      - 'security-mobile-app/**'
      - '.github/workflows/s4-mobile-release-gate.yml'

permissions:
  contents: write

concurrency:
  group: s4-mobile-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mobile-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: npm
          cache-dependency-path: security-mobile-app/package-lock.json

      - name: Reconcile lockfile from pinned manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check Guard Mobile
        run: npm run build:frontend

      # ── Core configuration and session (TECH-DEBT-CI-01) ──────────────────────
      # The mobile build inventory found every recent Android build pointing at the STAGING API, so
      # "latest build" and "sees production data" were not the same thing. This executes the real
      # resolver, which is what decides that.
      - name: Verify API base URL resolution
        run: npm run test:api-base-url

      # Real UAT saw intermittent 401s (UAT-CONN-01 / UAT-AUTH-01). These two execute the real request(),
      # refreshAccessToken() and logout() against a scripted fetch, so the single-flight guarantee, the
      # one-retry rule and "401 and only 401 clears the session" are proven rather than assumed.
      - name: Verify auth token refresh
        run: npm run test:auth-refresh

      - name: Verify session expiry handling
        run: npm run test:session-expiry

      # ── Role boundaries and navigation ────────────────────────────────────────
      # S4 is multi-role and the server role must override the chosen login portal. Also covers stored
      # session round-tripping, which is how a returning Guard lands back on the right surface.
      - name: Verify role routing and session restore
        run: npm run test:role-routing

      # Gated for one narrow reason: canAccessAdminPortal is the only assertion anywhere that a
      # non-admin role cannot reach the admin portal. The rest of this suite is admin UX that rides
      # along for free at under two seconds.
      - name: Verify admin portal role boundary
        run: npm run test:admin-portal

      # ── Workforce and compliance ──────────────────────────────────────────────
      # Option 3 is core pilot functionality: the pilot literally begins with a company inviting a guard.
      - name: Verify workforce invitation UI
        run: npm run test:workforce-invitations

      # UAT-COMP-01 changed two of this suite's assertions and the previous gate would not have caught
      # the breakage that change introduced — it was found by running the suite by hand.
      - name: Verify company compliance workspace
        run: npm run test:company-compliance

      # UAT-DEPLOY-01: the candidate list must separate a real blocker from an unknown, keep Assign
      # disabled while the server says ineligible, and route to the existing Compliance workflow.
      - name: Verify assign compliance guidance
        run: npm run test:assign-compliance

      # UAT-COMP-01: compliance expiry dates are entered and displayed as DD/MM/YYYY and converted to ISO
      # at the API boundary. The calendar arithmetic is executed, because Date rolls 31 April into 1 May.
      - name: Verify compliance date handling
        run: npm run test:compliance-date

      # Despite the file name this is the COMPANY-side Guards -> Compliance / Availability one-shot
      # target — the mechanism the UAT-DEPLOY-01 "Fix Compliance" route depends on.
      - name: Verify company guard navigation targets
        run: npm run test:guard-navigation

      # ── Shift operations ──────────────────────────────────────────────────────
      - name: Verify shift creation entry point
        run: npm run test:shift-entry

      # Guard profile completeness and vetting labels — a different layer from Book On, which never
      # looks at whether the Guard's own profile is usable.
      - name: Verify guard lifecycle labels
        run: npm run test:guard-lifecycle

      # UAT-ATT-01: an assigned Guard may Book On early, on time or late — the confirmation for a very
      # early Book On is a warning, never a block.
      - name: Verify guard book on
        run: npm run test:book-on

      # UAT-ATT-04: the GPS evidence client, executed with only the expo-location boundary stubbed —
      # never the runner's real GPS. Location is acquired only in response to the site's own GPS-required
      # 403, exactly once, and no other refusal triggers it.
      - name: Verify attendance GPS transport
        run: npm run test:gps-transport

      # W3 is pilot-critical. This also pins the dashboard to ONE refresh loop and fails if the frontend
      # ever grows its own welfare window arithmetic alongside the backend's.
      - name: Verify live operations welfare presentation
        run: npm run test:live-operations-welfare

      # UAT Round 1 Finding 4: a scheduled shift time is a true INSTANT in the SITE's timezone, never a
      # wall clock and never the operator's device zone. Executes the real conversion — DST transitions,
      # overnight shifts, the rejected spring-forward hour — and sweeps the source for the two conventions
      # that caused the defect: an offset-less ISO on a write path, and reading the hour literally out of an
      # ISO string on a display path.
      - name: Verify scheduled times are true instants
        run: npm run test:site-time

      # Phase 2 P0: a Guard could open an operational action form on the real device but could not
      # reliably press Submit — the persistent bottom nav (elevation 6) painted over an overlay that
      # only carried a zIndex, the card sat under the Android system navigation, and nothing scrolled.
      # Executes the layout arithmetic and the submit-button state, and renders the real modal to prove
      # the footer is NOT inside the scroll container.
      - name: Verify guard action forms stay reachable
        run: npm run test:guard-action-forms
      # Phase 3A-iii: Build 11 showed a reachable button that emitted no HTTP request, and reported the
      # refusal only through a banner the modal and keyboard covered. Phase 2 proved the press reached
      # the ROUTER and stopped there. This executes the production dispatcher itself — including a real
      # press on the real Button inside the real modal — through to a fake API adapter.
      - name: Verify guard actions reach the API
        run: npm run test:guard-action-dispatch

      # Phase 3C consolidated the active shift onto one action model: Welfare Check, Log Book, Site
      # Request, Incident, Emergency, and Book Off. Two of the old five had a second launcher in an
      # "On-shift reporting" block, and Check Call and Welfare were two names for one thing. The riskiest
      # part is legacy compatibility: the app now writes daily_logs.welfare_check, and every Welfare Check
      # recorded before this wrote check_call. Recognising only the new type would make all of that
      # history read as incomplete on both surfaces, so this executes the recogniser.
      - name: Verify live-shift action consolidation and legacy records
        run: npm run test:guard-action-consolidation

      # Phase 3D closed TECH-DEBT-OPS-02: the Guard app used to work out Welfare timing itself — last
      # evidence plus the shift's interval — against the backend's fixed window grid, its grace period
      # and its resolved interval. A Guard and their control room could disagree about whether a check
      # was due. The client now presents the backend's projection and decides nothing; this executes
      # that presentation and asserts it never reads a clock.
      - name: Verify guard welfare status comes from the backend
        run: npm run test:guard-welfare-status

      # Build 12 P0: the Guard screen carried TWO shift identities. The Current Shift card, the LIVE
      # badge, the live clock, the Welfare projection and Book On/Off all read currentHomeShift, while
      # the action dispatcher read selectedShift — which was re-pointed only when its id vanished from
      # the list, so a stale-but-present id stuck and every action refused a shift that genuinely was
      # not active. On a real device a shift showed In Progress, LIVE and checked in at 18:53 while
      # Welfare Check, Log Book and Emergency all refused as if no shift were active. This reproduces
      # that exact state and proves actions now target the live shift.
      - name: Verify current-shift actions target the live shift
        run: npm run test:current-shift-actions

      # Phase 3B: Live Operations is the control room, not shift history. It had no inclusion policy at
      # all — the board was every shift the company had ever created, so Monday's uncovered shift and
      # Tuesday's completed ones sat beside the one being worked, and "Re-cover required" never cleared
      # because it is derived and had nothing to acknowledge. This executes the inclusion and expiry
      # policy, both sides of the +4h and post-end boundaries, and the production UAT scenario.
      - name: Verify live operations stays operationally current
        run: npm run test:live-ops-policy

      # Phase 3B: the last two surfaces reading a clock time out of the stored ISO digits. Correct while
      # the backend stored a wall clock; wrong from the moment Phase 1 made those columns true instants,
      # which offered a 00:30 BST shift to the Guard as 23:30 on the previous day.
      - name: Verify shift offers render in site time
        run: npm run test:shift-offer-time

      # ── Phase 4A: the control-room timeline ───────────────────────────────────
      # The timeline replaced a flat table a controller read one shift at a time. Every position, label
      # and marker state comes from a pure geometry module, which is why the whole surface could be
      # proven before a pixel existed: which shifts are on the axis, where their bars start and end,
      # where each Welfare window marker sits and which state it carries, and where NOW is.
      - name: Verify operations timeline geometry
        run: npm run test:operations-timeline

      # The daily operations export, in both formats. Includes the formula-injection guard: a site or
      # guard name beginning = + - @ is user-supplied free text, and this file is evidence.
      - name: Verify operations report and export safety
        run: npm run test:operations-report

      # Phase 4A.3: Next Up, Upcoming Handovers and Today So Far — pure functions of the rows the board
      # already holds. Certifies the refusals above all: a replacement is never named when two shifts
      # could be it, never taken from another site, and never invented when there is none.
      - name: Verify control-room operational summaries
        run: npm run test:operations-outlook

      # Phase 4A.3 presentation, asserted against markup rendered through react-native-web rather than
      # by reading the source. A live shift carrying an overdue and a missed Welfare Check must not be
      # painted in the most reassuring colour on the page, and the exception markers must differ in
      # SHAPE, not only in colour. Also re-checks that the whole surface still has exactly one polling
      # loop and no socket.
      - name: Verify control-room presentation
        run: npm run test:operations-visual

      # PRODUCTION UAT FIX 01. Two defects the real board showed minutes after the Phase 4A deploy: the
      # Shift Operations drawer opened by itself on a plain navigation and reopened after the operator
      # closed it, and the screen contradicted itself — metric 1, summary 1 shift, timeline 0 — because a
      # guard who booked on and never booked off was still drawn at yesterday's scheduled time.
      - name: Verify Live Operations entry and live carry-over
        run: npm run test:live-ops-entry

      # UAT FIX 02. Attention Now identified problems but gave Control no way to handle one. Certifies
      # that the resolve dialog offers exactly the reasons the API accepts, that the stored machine
      # value and the displayed words stay separate, that a Missing Book Off is named and timed rather
      # than lumped into generic safety, and that the Welfare terminology cleanup renamed no stored enum.
      - name: Verify alert resolution workflow
        run: npm run test:alert-resolution

      # ── Screening ─────────────────────────────────────────────────────────────
      # Protects the Guard screening journey and the locked distinction that Company-Managed deployment
      # is NOT S4 Screening. Note it also reads backend screening sources, so it doubles as a contract
      # check across the monorepo.
      - name: Verify guard screening UI
        run: npm run test:screening-ui

      # ── Web safety ────────────────────────────────────────────────────────────
      # A bundle exports perfectly happily with a style that crashes the browser, so the export alone
      # never proved the web app renders. This renders real elements through react-dom/server.
      - name: Verify web style safety
        run: npm run test:web-style

      # ── Build provenance ──────────────────────────────────────────────────────
      # app.json is the authoritative version source, and the pilot profile is an internal APK on the
      # PRODUCTION API. A tester who cannot name their build cannot report a frontend defect reliably.
      - name: Verify pilot build provenance
        run: npm run test:pilot-build

      # UAT-MOB-02: the permanent Android signing identity. CI signs nothing, so this step makes NO claim
      # about an artefact — it certifies that the expected certificate is pinned (public fingerprint only)
      # and that the comparison logic really refuses a wrong signer, executed against recorded output from
      # the historical 1.0.4 and the rejected Build 8. The APK itself is checked after an EAS build by
      # `npm run verify:apk-signer -- <apk>`, which is the only place a signed APK exists.
      - name: Verify android signer provenance
        run: npm run test:signer-provenance

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Verify Android production bundle
        run: npx expo export --platform android --output-dir dist-android

      # The Company control room is a WEB deployment, so the web bundle is the artefact that actually
      # ships for Phase 4A. The Android export above says nothing about it.
      - name: Verify web production bundle
        run: npx expo export --platform web --output-dir dist-web

      # The board a controller reads and the file they hand over must describe the same operations. A
      # silent difference between them is the worst failure this feature could have, so it is proven
      # here against a fixture at a fixed instant: visible rows against summary rows, markers against
      # Welfare detail rows, and every marker's glyph against its exported status.
      - name: Verify timeline and export agree
        run: npm run test:operations-consistency

      - name: Commit deterministic lockfile reconciliation
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- security-mobile-app/package-lock.json; then
            echo 'Mobile lockfile already matches the pinned manifest.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-mobile-app/package-lock.json
          git commit -m 'Synchronize Guard Mobile lockfile'
          git push
