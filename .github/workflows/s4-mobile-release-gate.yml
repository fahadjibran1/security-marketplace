name: S4 Mobile Release Gate

on:
  push:
    branches:
      - s4-release-stabilization
    paths:
      - 'security-mobile-app/**'
      - '.github/workflows/s4-mobile-release-gate.yml'
  pull_request:
    paths:
      - 'security-mobile-app/**'
      - '.github/workflows/s4-mobile-release-gate.yml'

permissions:
  contents: write

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: npm
          cache-dependency-path: security-mobile-app/package-lock.json

      - name: Reconcile Expo SDK dependencies
        if: github.event_name == 'push'
        run: |
          npx expo install --fix
          npx expo install expo-location

      - name: Install locked dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Type-check Guard Mobile
        run: npm run build:frontend

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Commit deterministic dependency lock update
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- security-mobile-app/package.json security-mobile-app/package-lock.json; then
            echo 'Dependency manifest and lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security-mobile-app/package.json security-mobile-app/package-lock.json
          git commit -m 'Sync mobile Expo dependencies'
          git push
